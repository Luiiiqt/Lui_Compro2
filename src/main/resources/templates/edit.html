<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit [[${coffee.name}]]</title>
</head>
<body>

<h1 th:text="'Edit ' + ${coffee.name}"></h1>

<div>
    <form action="/update" method="POST">
        <input type="hidden" name="id" th:value="${coffee.id}">
        <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" th:value="${coffee.name}" required>
        </div>

        <div>
            <label for="type">Type</label>
            <input type="text" id="type" name="type" th:value="${coffee.type}" required>
        </div>

        <div>
            <label for="size">Size</label>
            <input type="text" id="size" name="size" th:value="${coffee.size}" required>
        </div>

        <div>
            <label for="price">Price</label>
            <input type="number" id="price" step="0.01" name="price" th:value="${coffee.price}" required>
        </div>

        <div>
            <label for="roastLevel">Roast Level</label>
            <input type="text" id="roastLevel" name="roastLevel" th:value="${coffee.roastLevel}" required>
        </div>

        <div>
            <label for="origin">Origin</label>
            <input type="text" id="origin" name="origin" th:value="${coffee.origin}" required>
        </div>

        <div>
            <label>Decaf</label>
            <input type="checkbox" name="isDecaf" th:checked="${coffee.isDecaf}">
        </div>

        <div>
            <label for="stock">Stock</label>
            <input type="number" id="stock" name="stock" th:value="${coffee.stock}" required>
        </div>

        <div>
            <label for="flavorNotes">Flavor Notes</label>
            <input type="text" id="flavorNotes" name="flavorNotes" th:value="${coffee.flavorNotes}" required>
        </div>

        <div>
            <label for="brewMethod">Brew Method</label>
            <input type="text" id="brewMethod" name="brewMethod" th:value="${coffee.brewMethod}" required>
        </div>

        <button type="submit">Update Coffee</button>
    </form>
</div>

<br>
<a href="/">Back to List</a>

</body>
</html>
